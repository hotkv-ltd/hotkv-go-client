name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        name: Build & Test
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                go-version: ["1.21", "1.22", "1.23"]

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ matrix.go-version }}

            - name: Build
              run: go build ./...

            - name: Vet
              run: go vet ./...

            - name: Test
              run: go test -v -count=1 -race ./...
              # HOTKV_TEST_URL is intentionally unset here: TestIntegration
              # (and its subtests) skip themselves when no server is
              # configured, instead of failing. Run it locally against a
              # HotKV server with HOTKV_TEST_URL set for full coverage.

    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23"

            - name: Check formatting
              run: |
                  output=$(gofmt -l .)
                  if [ -n "$output" ]; then
                      echo "Files not formatted:"
                      echo "$output"
                      exit 1
                  fi

            - name: Vet
              run: go vet ./...

    license-check:
        name: License Header Check
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Check license headers
              run: |
                  missing=""
                  for f in $(find . -name "*.go" -not -path "./vendor/*"); do
                      if ! head -1 "$f" | grep -q "Copyright (c) 2026 HotKV Ltd"; then
                          missing="$missing\n  $f"
                      fi
                  done
                  if [ -n "$missing" ]; then
                      echo "Files missing license header:$missing"
                      exit 1
                  fi
                  echo "All Go files have correct license headers."
